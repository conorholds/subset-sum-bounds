name: Verify
run-name: "Manual verification: ${{ inputs.pr && format('PR #{0}', inputs.pr) || 'main' }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to verify; leave blank to verify main'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: manual-verification
  cancel-in-progress: false

jobs:
  prepare:
    name: Select commit
    if: >-
      github.repository == 'conorholds/subset-sum-bounds' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '86416572' && github.triggering_actor == 'conorholds'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      checks: write
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      check_id: ${{ steps.target.outputs.check_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: target
        name: Pin the requested commit and start its check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
        run: python3 -B scripts/manual_ci.py start --pr "$INPUT_PR"

  verify:
    name: Run tests and certificates
    needs: prepare
    if: >-
      github.repository == 'conorholds/subset-sum-bounds' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '86416572' && github.triggering_actor == 'conorholds'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: make check
      - name: Require committed files unchanged
        if: always()
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code "$EXPECTED_SHA" --
      - name: Retain interval receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ needs.prepare.outputs.sha }}-${{ github.run_attempt }}
          path: .context/verification/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  report:
    name: Publish commit result
    needs: [prepare, verify]
    if: >-
      always() && needs.prepare.outputs.check_id != '' &&
      github.repository == 'conorholds/subset-sum-bounds' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '86416572' && github.triggering_actor == 'conorholds'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Complete the check for the pinned commit
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ needs.prepare.outputs.check_id }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: >-
          python3 -B scripts/manual_ci.py finish
          --check-id "$CHECK_ID" --sha "$TARGET_SHA" --result "$VERIFY_RESULT"
